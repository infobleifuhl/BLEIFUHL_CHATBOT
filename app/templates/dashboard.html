<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLEIFÜHL Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 20px 40px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .admin {
            font-size: 14px;
            color: #666;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .card-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-number {
            font-size: 32px;
            font-weight: bold;
        }

        .leads-section {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
        }

        .leads-section h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f8f8;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .container {
                margin-top: 20px;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">BLEIFÜHL</div>

        <div class="admin">
            Admin Panel
        </div>
    </header>


    <main class="container">

        <h1>Dashboard</h1>

        <p class="subtitle">
            Chatbot üzerinden gelen müşteri adaylarını buradan görüntüleyebilirsiniz.
        </p>


        <section class="cards">

            <div class="card">
                <div class="card-title">
                    Toplam Lead
                </div>

                <div class="card-number" id="toplamLead">
                    0
                </div>
            </div>


            <div class="card">
                <div class="card-title">
                    Bugünkü Lead
                </div>

                <div class="card-number" id="bugunkuLead">
                    0
                </div>
            </div>


            <div class="card">
                <div class="card-title">
                    Durum
                </div>

                <div class="card-number">
                    Aktif
                </div>
            </div>

        </section>


        <section class="leads-section">

            <h2>Leadler</h2>

            <div id="leadContainer">

                <div class="empty">
                    Leadler yükleniyor...
                </div>

            </div>

        </section>

    </main>


    <script>

        async function leadleriGetir() {

            try {

                const response = await fetch("/api/leads");

                const data = await response.json();

                if (!data.basari) {

                    document.getElementById("leadContainer").innerHTML =
                        '<div class="empty">Leadler yüklenemedi.</div>';

                    return;
                }


                const leadler = data.leadler;


                document.getElementById("toplamLead").textContent =
                    leadler.length;


                if (leadler.length === 0) {

                    document.getElementById("leadContainer").innerHTML =
                        '<div class="empty">Henüz kayıtlı lead bulunmuyor.</div>';

                    return;
                }


                let tablo = `
                    <table>

                        <thead>

                            <tr>
                                <th>İsim</th>
                                <th>Telefon</th>
                                <th>Mesaj</th>
                            </tr>

                        </thead>

                        <tbody>
                `;


                leadler.forEach(function(lead) {

                    tablo += `
                        <tr>

                            <td>
                                ${lead.isim || "-"}
                            </td>

                            <td>
                                ${lead.telefon || "-"}
                            </td>

                            <td>
                                ${lead.mesaj || "-"}
                            </td>

                        </tr>
                    `;

                });


                tablo += `
                        </tbody>
                    </table>
                `;


                document.getElementById("leadContainer").innerHTML = tablo;

            }

            catch (error) {

                console.error("Leadler alınamadı:", error);

                document.getElementById("leadContainer").innerHTML =
                    '<div class="empty">Bir hata oluştu.</div>';
            }

        }


        leadleriGetir();

    </script>

</body>
</html>
