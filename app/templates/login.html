<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEIFÜHL Admin Girişi</title>
</head>

<body>

    <h1>BLEIFÜHL Admin</h1>

    <form method="POST" action="/login">

        <div>
            <label for="username">Kullanıcı Adı</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div>
            <label for="password">Şifre</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">Giriş Yap</button>

    </form>

</body>
</html>
